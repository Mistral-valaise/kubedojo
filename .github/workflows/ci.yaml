name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Nightly: every question twice (with a reset in between) and as a full exam.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  K8S_VERSION: v1.37.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v7
        with: {node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: make build
      - run: test -z "$(gofmt -l cmd internal content images deploy tools)"
      - run: go vet ./...
      - run: make test
      # Downloading Chromium took between 30 seconds and 7 minutes; keep it.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - run: ./bin/kubedojo content lint --strict
      # Multiple-choice tracks need no cluster, so they are proven right here.
      - name: Quiz proofs
        run: |
          for f in content/*/track.yaml; do
            grep -qE '^kind:[[:space:]]*theory[[:space:]]*$' "$f" || continue
            track=$(basename "$(dirname "$f")")
            ./bin/kubedojo content test --track "$track"
            ./bin/kubedojo content test --track "$track" --exam
          done
      # Do the dashboards parse, and do they only query metrics that exist?
      - run: make lint-dashboards
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/kubedojo
      # The optional parts of the chart are not rendered with the defaults.
      - name: Chart with every option
        run: |
          opts="--set lgtm.enabled=true --set alerts.enabled=true --set ingress.enabled=true --set dashboards.enabled=false"
          helm lint deploy/helm/kubedojo $opts
          helm template kubedojo deploy/helm/kubedojo $opts > /dev/null

  # Its own job: it takes as long as everything else in build together.
  cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: |
          mkdir -p internal/webui/dist && touch internal/webui/dist/.gitkeep
          for target in darwin/arm64 darwin/amd64 linux/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/kubedojo
          done

  # Which questions does this change need proven? See .github/content-matrix.sh.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ALL: ${{ contains(github.event.pull_request.labels.*.name, 'content') }}
        run: |
          matrix=$(.github/content-matrix.sh)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Proves questions against real clusters: unsolved fails, the reference
  # solution passes, the grade is stable, variants get the declared grade.
  # Pull requests and pushes prove what they changed, with --quick; the nightly
  # job proves everything in full. See docs/verification.md.
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [changes]
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.33.0}
      # Several kind clusters need more inotify instances than the runner allows.
      - run: sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=1048576
      - uses: docker/setup-buildx-action@v4
      - name: Node image
        uses: docker/build-push-action@v7
        with:
          context: images/node
          load: true
          build-args: K8S_VERSION=${{ env.K8S_VERSION }}
          tags: kubedojo/node:${{ env.K8S_VERSION }}
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max
      - name: Terminal image
        uses: docker/build-push-action@v7
        with:
          context: images/terminal
          load: true
          build-args: K8S_VERSION=${{ env.K8S_VERSION }}
          tags: kubedojo/terminal:${{ env.K8S_VERSION }}
          cache-from: type=gha,scope=terminal
          cache-to: type=gha,scope=terminal,mode=max
      # The lab host of tracks without a cluster. Every track gets all images:
      # with the cache that is cheaper than a job that knows which track needs what.
      - name: Linux image
        uses: docker/build-push-action@v7
        with:
          context: images/linux
          load: true
          tags: kubedojo/linux:trixie
          cache-from: type=gha,scope=linux
          cache-to: type=gha,scope=linux,mode=max
      - run: make go
      - env:
          QUESTIONS: ${{ matrix.questions }}
        run: ./bin/kubedojo content test --track ${{ matrix.track }} ${QUESTIONS:+--question "$QUESTIONS"} --quick --report content-${{ matrix.track }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: content-report-${{ matrix.track }}
          path: content-${{ matrix.track }}.json
          if-no-files-found: warn

  # The expensive proofs: every question twice with a reset in between (flaky
  # checks, leftovers), and all questions of a track together graded as an exam.
  content-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        track: [cka, ckad, cks, linux]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      # A track without a cluster (linux) needs neither kind nor the sysctl;
      # both are harmless there, and `make images` builds its image too.
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.33.0}
      - run: sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=1048576
      - run: make images go
      - run: ./bin/kubedojo content test --track ${{ matrix.track }} --repeat 2 --report repeat-${{ matrix.track }}.json
      - run: ./bin/kubedojo content test --track ${{ matrix.track }} --exam --report exam-${{ matrix.track }}.json
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: content-nightly-${{ matrix.track }}
          path: "*-${{ matrix.track }}.json"
          if-no-files-found: warn
