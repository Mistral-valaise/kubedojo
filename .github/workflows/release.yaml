name: release
on:
  push:
    tags: ["v*"]

# Nothing is granted here. Each job asks for what it publishes, and for
# id-token where it signs: the short-lived certificate of a keyless signature
# names this workflow and the tag (see "Verifying a release" in SECURITY.md).
permissions:
  contents: read

jobs:
  # Nothing is published from a commit that does not build, lint and test. The
  # questions were proven when the commit reached main, and are again every night.
  ci:
    uses: ./.github/workflows/ci.yaml
    with: {content: false}
    permissions:
      contents: read

  binaries:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign checksums.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 26}
      - run: make web
      # goreleaser calls both (.goreleaser.yaml): syft writes an SBOM for every
      # archive, cosign signs checksums.txt, which lists archives and SBOMs.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: {version: "~> v2", args: release --clean}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Image names must be lowercase, so the owner is spelled out here.
  images:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the images and their signatures
      id-token: write # sign the images
    env:
      REGISTRY: ghcr.io/mistral-valaise
      K8S_VERSION: v1.37.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/kubedojo-server:${{ github.ref_name }}
      - name: Node image
        id: node
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/node
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: K8S_VERSION=${{ env.K8S_VERSION }}
          # The second tag never moves: a sandbox host image, and with it a
          # release, always gets the node image it was built and tested with.
          tags: |
            ${{ env.REGISTRY }}/kubedojo-node:${{ env.K8S_VERSION }}
            ${{ env.REGISTRY }}/kubedojo-node:${{ env.K8S_VERSION }}-${{ github.ref_name }}
      - name: Terminal image
        id: terminal
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/terminal
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: K8S_VERSION=${{ env.K8S_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/kubedojo-terminal:${{ env.K8S_VERSION }}
            ${{ env.REGISTRY }}/kubedojo-terminal:${{ env.K8S_VERSION }}-${{ github.ref_name }}
      # The tag names the Debian release; the image knows no Kubernetes version.
      - name: Linux image
        id: linux
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/linux
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.REGISTRY }}/kubedojo-linux:trixie
            ${{ env.REGISTRY }}/kubedojo-linux:trixie-${{ github.ref_name }}
      # The sandbox host carries the node, terminal and linux images as tarballs.
      # It is built for amd64 only; build it yourself with `make sandbox-host`
      # for arm64 sandbox nodes.
      - name: Sandbox host image (amd64)
        id: sandbox-host
        run: |
          # By the tags of this release, which nothing overwrites.
          docker pull --platform linux/amd64 $REGISTRY/kubedojo-node:$K8S_VERSION-${{ github.ref_name }}
          docker pull --platform linux/amd64 $REGISTRY/kubedojo-terminal:$K8S_VERSION-${{ github.ref_name }}
          docker pull --platform linux/amd64 $REGISTRY/kubedojo-linux:trixie-${{ github.ref_name }}
          docker tag $REGISTRY/kubedojo-node:$K8S_VERSION-${{ github.ref_name }} kubedojo/node:$K8S_VERSION
          docker tag $REGISTRY/kubedojo-terminal:$K8S_VERSION-${{ github.ref_name }} kubedojo/terminal:$K8S_VERSION
          docker tag $REGISTRY/kubedojo-linux:trixie-${{ github.ref_name }} kubedojo/linux:trixie
          docker save -o images/sandbox-host/node.tar kubedojo/node:$K8S_VERSION
          docker save -o images/sandbox-host/terminal.tar kubedojo/terminal:$K8S_VERSION
          docker save -o images/sandbox-host/linux.tar kubedojo/linux:trixie
          docker build --platform linux/amd64 -t $REGISTRY/kubedojo-sandbox-host:${{ github.ref_name }} images/sandbox-host
          docker push $REGISTRY/kubedojo-sandbox-host:${{ github.ref_name }}
          # The digest the registry stored, for the signature below.
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REGISTRY/kubedojo-sandbox-host:${{ github.ref_name }}" \
            | sed -n "s|^$REGISTRY/kubedojo-sandbox-host@||p" | head -n1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Keyless signatures (Sigstore), stored in the registry next to the images.
      # Always by digest, never by tag: a tag can be moved, a digest cannot.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the images
        env:
          SERVER: ${{ steps.server.outputs.digest }}
          NODE: ${{ steps.node.outputs.digest }}
          TERMINAL: ${{ steps.terminal.outputs.digest }}
          LINUX: ${{ steps.linux.outputs.digest }}
          SANDBOX_HOST: ${{ steps.sandbox-host.outputs.digest }}
        run: |
          sign() {
            if [[ ! "$2" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::no digest for $1, so it stays unsigned"; return 1
            fi
            cosign sign --yes "$REGISTRY/$1@$2"
          }
          sign kubedojo-server "$SERVER"
          sign kubedojo-node "$NODE"
          sign kubedojo-terminal "$TERMINAL"
          sign kubedojo-linux "$LINUX"
          sign kubedojo-sandbox-host "$SANDBOX_HOST"

  # The chart, as an OCI artifact next to the images it installs:
  #   helm install kubedojo oci://ghcr.io/mistral-valaise/charts/kubedojo --version <x.y.z>
  # Its version and appVersion are the tag, so that a chart always installs
  # the images of its own release.
  chart:
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the chart and its signature
      id-token: write # sign the chart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Package and push
        id: push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version=${VERSION#v}
          helm lint deploy/helm/kubedojo
          helm package deploy/helm/kubedojo --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "kubedojo-$version.tgz" oci://ghcr.io/mistral-valaise/charts 2>&1 | tee push.log
          # helm prints the digest of what it pushed: "Digest: sha256:...".
          digest=$(awk '$1 == "Digest:" {print $2}' push.log)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::helm push printed no digest, so the chart stays unsigned"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # helm keeps its login to itself, so cosign logs in on its own.
      - name: Sign the chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
          cosign sign --yes "ghcr.io/mistral-valaise/charts/kubedojo@$DIGEST"
