# Weekly update pull requests. Minor and patch updates of one ecosystem arrive
# together, so there is one pull request to review, not twenty.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      go: {update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      web: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: docker
    directories: [/, /images/linux, /images/node, /images/sandbox-host, /images/terminal]
    schedule: {interval: weekly}
