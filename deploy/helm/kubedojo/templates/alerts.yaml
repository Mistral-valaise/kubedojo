{{- if .Values.alerts.enabled }}
{{- /* The rules are written once, in observability/rules.yaml. Those with the
       scope kubernetes become this PrometheusRule; those with the scope local
       are Grafana-managed rules of the single-container stack. */}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kubedojo.name" . }}
  labels:
    {{- include "kubedojo.labels" . | nindent 4 }}
    {{- with .Values.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kubedojo
      rules:
        {{- range (.Files.Get "observability/rules.yaml" | fromYaml).rules }}
        {{- if has "kubernetes" .scope }}
        - alert: {{ .name }}
          expr: {{ .expr | quote }}
          for: {{ .for }}
          labels: {severity: {{ .severity }}}
          annotations:
            summary: {{ .summary | quote }}
            description: {{ .description | quote }}
        {{- end }}
        {{- end }}
{{- end }}
