{{- if .Values.lgtm.enabled }}
{{- $name := printf "%s-lgtm" (include "kubedojo.name" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "kubedojo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kubedojo-lgtm, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kubedojo-lgtm, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations:
        # Grafana reads provisioning files at start: a changed file restarts the Pod.
        checksum/provisioning: {{ (.Files.Glob "observability/*.yaml").AsConfig | sha256sum }}
    spec:
      containers:
        - name: lgtm
          image: {{ .Values.lgtm.image }}
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          readinessProbe:
            exec: {command: [cat, /tmp/ready]}
            periodSeconds: 5
            failureThreshold: 60
          resources: {{- toYaml .Values.lgtm.resources | nindent 12 }}
          volumeMounts:
            - {name: dashboards, mountPath: /otel-lgtm/kubedojo-dashboards}
            - {name: provisioning, mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/kubedojo.yaml, subPath: dashboards-provider.yaml}
            - {name: provisioning, mountPath: /otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml, subPath: datasources.yaml}
      volumes:
        - name: provisioning
          configMap: {name: {{ $name }}-provisioning}
        - name: dashboards
          configMap: {name: {{ $name }}-dashboards}
---
# The same provisioning files `kubedojo up --observability` mounts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-provisioning
  labels: {{- include "kubedojo.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "observability/*.yaml" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
# Its own copy of the dashboards: the stack must not depend on
# dashboards.enabled or dashboards.namespace, which serve a Grafana sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboards
  labels: {{- include "kubedojo.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "kubedojo.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: kubedojo-lgtm, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - {name: grafana, port: 3000}
    - {name: otlp-grpc, port: 4317}
    - {name: otlp-http, port: 4318}
{{- end }}
