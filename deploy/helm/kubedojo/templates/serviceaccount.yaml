apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubedojo.name" . }}
  labels: {{- include "kubedojo.labels" . | nindent 4 }}
---
# The server creates, finds and deletes sandbox Pods in its own Namespace.
# Whoever can create Pods in a Namespace that admits privileged ones is root
# on its nodes: keep this ServiceAccount to the server, and the Namespace to
# kubedojo.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubedojo.name" . }}
  labels: {{- include "kubedojo.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    # list: to find and remove sandbox Pods that belong to no session.
    verbs: [create, get, list, delete]
  # Reads its own Deployment, and no other, to make it the owner of the
  # sandbox Pods: Kubernetes then removes them with the release.
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ include "kubedojo.name" . }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubedojo.name" . }}
  labels: {{- include "kubedojo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubedojo.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubedojo.name" . }}
    namespace: {{ .Release.Namespace }}
