apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubedojo.name" . }}
  labels: {{- include "kubedojo.labels" . | nindent 4 }}
---
# The server creates, watches and deletes sandbox Pods in its own Namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubedojo.name" . }}
  labels: {{- include "kubedojo.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubedojo.name" . }}
  labels: {{- include "kubedojo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubedojo.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubedojo.name" . }}
    namespace: {{ .Release.Namespace }}
