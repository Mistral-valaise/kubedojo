# -- kubedojo server
image:
  repository: ghcr.io/mistral-valaise/kubedojo-server
  tag: ""            # defaults to v<appVersion>
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Maximum number of live sessions (each owns a sandbox Pod).
maxSessions: 5
# Maximum number of terminal tabs one session may have open at the same time.
maxTerminals: 4
# Remove sandboxes nobody used for this long. "0" disables the cleanup.
idleTTL: 3h
# When the Pod is stopped (an upgrade, a node drain), the server waits this
# long for running work: an exam being graded, a cluster being created. What
# is still running then is recorded as interrupted. The Pod's termination
# grace period is 15 seconds longer.
shutdownGraceSeconds: 60

# More environment for the server, e.g. OTEL_EXPORTER_OTLP_HEADERS from a Secret.
extraEnv: []
extraEnvFrom: []

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}

# History and progress are stored in SQLite on this volume.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  # `helm uninstall` leaves the volume, so that removing the release does not
  # delete what people learned. Delete it yourself when you mean it:
  #   kubectl delete pvc <release name>
  keepOnUninstall: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # Publishing kubedojo without a login gives everyone who reaches the host a
  # root shell in a privileged Pod. The chart refuses ingress.enabled without
  # oidc.enabled unless you say that access is restricted some other way.
  allowUnauthenticated: false
  className: ""
  # The chart sets no annotations: they are specific to the ingress
  # controller. The terminal is a WebSocket that stays open for hours.
  #   Traefik (k3s): no annotation needed; see docs/deployment.md for timeouts.
  #   ingress-nginx:
  #     nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #     nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  annotations: {}
  host: kubedojo.example.com
  tls:
    enabled: false
    secretName: kubedojo-tls

# -- Sandboxes
# Every session gets its own Pod running Docker-in-Docker, in which kubedojo
# creates the practice clusters. These Pods are PRIVILEGED. Run them on a
# dedicated, tainted node pool and never on nodes with other tenants' workloads.
sandbox:
  image:
    repository: ghcr.io/mistral-valaise/kubedojo-sandbox-host
    tag: ""          # defaults to v<appVersion>
  kubernetesVersion: v1.37.0
  nodeImage: ""      # defaults to kubedojo/node:<kubernetesVersion> (preloaded in the sandbox host image)
  terminalImage: ""  # defaults to kubedojo/terminal:<kubernetesVersion>
  linuxImage: ""     # host of tracks without a cluster; defaults to kubedojo/linux:trixie (preloaded as well)
  # What one sandbox gets. Requests are reserved on the node: maxSessions
  # times the requests must fit, or sandboxes stay Pending. Limits are what one
  # sandbox may use at most; an empty limit is no limit. A sandbox with one
  # cluster uses 2-3 GB of memory, a full exam with two clusters 3-5 GB.
  # Sizing examples: docs/deployment.md.
  resources:
    cpuRequest: "1"
    cpuLimit: "4"
    memoryRequest: 3Gi
    memoryLimit: 8Gi
    # The node's disk: images and the clusters' filesystems. A sandbox above
    # the limit is evicted, which ends that session.
    ephemeralStorageRequest: 10Gi
    ephemeralStorageLimit: 30Gi
  # Schedule sandbox Pods onto a dedicated pool, e.g. {kubedojo.dev/pool: sandbox}
  nodeSelector: {}
  # Taint key that pool carries with effect NoSchedule, e.g. kubedojo.dev/sandbox
  tolerationKey: ""
  # URL of an existing Docker Hub mirror (used when registryCache.enabled is false).
  registryMirror: ""
  # Only the kubedojo server may reach the Docker daemons of sandbox Pods, and
  # sandboxes may not reach private addresses. Requires a CNI that enforces
  # NetworkPolicies: k3s does (kube-router), unless it was started with
  # --disable-network-policy.
  networkPolicy:
    enabled: true
    # More destinations sandboxes must not reach, as CIDRs. A node with a
    # PUBLIC address belongs here: it is not in the private ranges, and its
    # kubelet, API server and SSH would be reachable from every sandbox.
    #   extraExceptCIDRs: [203.0.113.10/32]
    extraExceptCIDRs: []

# -- Image cache
# A pull-through cache for Docker Hub shared by all sandboxes. Set
# registryCache.enabled=false and sandbox.registryMirror to use your own mirror.
registryCache:
  enabled: true
  image: registry:2
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}

# -- Authentication
# Without OIDC the UI is open to everyone who can reach it: all visitors share
# one identity. Enable OIDC (or protect the Ingress otherwise) before exposing it.
oidc:
  enabled: false
  issuerURL: ""
  clientID: ""
  # Secret with the keys `client-secret` and `cookie-secret` (32 random bytes, base64).
  existingSecret: ""
  emailDomains: ["*"]
  # The session cookie is only sent over HTTPS. Turn this off only for a test
  # over plain HTTP: with it on, a login over HTTP loops forever.
  cookieSecure: true
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
  extraArgs: []

# -- AI tutor (optional). Secret with the key `api-key`.
tutor:
  existingSecret: ""
  model: ""

# -- Observability
telemetry:
  # OTLP/HTTP endpoint that receives traces, metrics and logs,
  # e.g. Grafana Alloy: http://alloy.monitoring.svc:4318
  otlpEndpoint: ""
  # Headers for the receiver, e.g. the credentials of Grafana Cloud or of an
  # authenticating gateway: a Secret whose key holds
  # "Authorization=Basic <base64>" (the format of OTEL_EXPORTER_OTLP_HEADERS).
  headersSecret:
    name: ""
    key: headers
  resourceAttributes: {}

dashboards:
  # ConfigMaps picked up by the Grafana dashboard sidecar.
  enabled: true
  label: grafana_dashboard
  labelValue: "1"
  folderAnnotation: grafana_folder
  folder: kubedojo
  namespace: ""      # defaults to the release namespace

alerts:
  # PrometheusRule (Prometheus Operator, or Alloy's mimir.rules.kubernetes for Mimir).
  enabled: false
  labels: {}

# Single-container Grafana LGTM stack FOR EVALUATION: Grafana, Prometheus,
# Loki, Tempo and a collector in one Pod, with kubedojo's dashboards and alert
# rules. It is the stack of `kubedojo up --observability`. One Pod, no
# redundancy, no backup, and by default no login and no persistence. For
# anything you depend on, use telemetry.otlpEndpoint with your own stack.
lgtm:
  enabled: false
  # How long metrics, logs and traces are kept; at least 24h.
  retention: 168h
  # Without persistence the data is gone when the Pod restarts.
  persistence:
    enabled: false
    size: 10Gi
    storageClass: ""
  # Secret with the keys `admin-user` and `admin-password`. Empty: everyone
  # who reaches Grafana is its administrator. Grafana is not published by the
  # chart; reach it with kubectl port-forward.
  adminSecret: ""
  # The version kubedojo is tested with; its provisioning files are mounted
  # over the image's, so other versions may not fit.
  image: grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
  resources:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {memory: 2Gi}
