# -- kubedojo server
image:
  repository: ghcr.io/mistral-valaise/kubedojo-server
  tag: ""            # defaults to v<appVersion>
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Maximum number of live sessions (each owns a sandbox Pod).
maxSessions: 5
# Maximum number of terminal tabs one session may have open at the same time.
maxTerminals: 4
# Remove sandboxes nobody used for this long. "0" disables the cleanup.
idleTTL: 3h

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}

# History and progress are stored in SQLite on this volume.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: kubedojo.example.com
  tls:
    enabled: false
    secretName: kubedojo-tls

# -- Sandboxes
# Every session gets its own Pod running Docker-in-Docker, in which kubedojo
# creates the practice clusters. These Pods are PRIVILEGED. Run them on a
# dedicated, tainted node pool and never on nodes with other tenants' workloads.
sandbox:
  image:
    repository: ghcr.io/mistral-valaise/kubedojo-sandbox-host
    tag: ""          # defaults to v<appVersion>
  kubernetesVersion: v1.37.0
  nodeImage: ""      # defaults to kubedojo/node:<kubernetesVersion> (preloaded in the sandbox host image)
  terminalImage: ""  # defaults to kubedojo/terminal:<kubernetesVersion>
  linuxImage: ""     # host of tracks without a cluster; defaults to kubedojo/linux:trixie (preloaded as well)
  # What one sandbox gets. Requests are reserved on the node: maxSessions
  # times the requests must fit, or sandboxes stay Pending. Limits are what one
  # sandbox may use at most; an empty limit is no limit. A sandbox with one
  # cluster uses 2-3 GB of memory, a full exam with two clusters 3-5 GB.
  # Sizing examples: docs/deployment.md.
  resources:
    cpuRequest: "1"
    cpuLimit: "4"
    memoryRequest: 3Gi
    memoryLimit: 8Gi
    # The node's disk: images and the clusters' filesystems. A sandbox above
    # the limit is evicted, which ends that session.
    ephemeralStorageRequest: 10Gi
    ephemeralStorageLimit: 30Gi
  # Schedule sandbox Pods onto a dedicated pool, e.g. {kubedojo.dev/pool: sandbox}
  nodeSelector: {}
  # Taint key that pool carries with effect NoSchedule, e.g. kubedojo.dev/sandbox
  tolerationKey: ""
  # URL of an existing Docker Hub mirror (used when registryCache.enabled is false).
  registryMirror: ""
  # Only the kubedojo server may reach the Docker daemons of sandbox Pods.
  # Requires a CNI that enforces NetworkPolicies.
  networkPolicy:
    enabled: true

# -- Image cache
# A pull-through cache for Docker Hub shared by all sandboxes. Set
# registryCache.enabled=false and sandbox.registryMirror to use your own mirror.
registryCache:
  enabled: true
  image: registry:2
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}

# -- Authentication
# Without OIDC the UI is open to everyone who can reach it: all visitors share
# one identity. Enable OIDC (or protect the Ingress otherwise) before exposing it.
oidc:
  enabled: false
  issuerURL: ""
  clientID: ""
  # Secret with the keys `client-secret` and `cookie-secret` (32 random bytes, base64).
  existingSecret: ""
  emailDomains: ["*"]
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
  extraArgs: []

# -- AI tutor (optional). Secret with the key `api-key`.
tutor:
  existingSecret: ""
  model: ""

# -- Observability
telemetry:
  # OTLP/HTTP endpoint that receives traces, metrics and logs,
  # e.g. Grafana Alloy: http://alloy.monitoring.svc:4318
  otlpEndpoint: ""
  resourceAttributes: {}

dashboards:
  # ConfigMaps picked up by the Grafana dashboard sidecar.
  enabled: true
  label: grafana_dashboard
  labelValue: "1"
  folderAnnotation: grafana_folder
  folder: kubedojo
  namespace: ""      # defaults to the release namespace

alerts:
  # PrometheusRule (Prometheus Operator, or Alloy's mimir.rules.kubernetes for Mimir).
  enabled: false
  labels: {}

# Single-container Grafana LGTM stack for evaluation. Not for production:
# no persistence, no authentication. Use telemetry.otlpEndpoint with your own
# stack instead.
lgtm:
  enabled: false
  # The version kubedojo is tested with; its provisioning files are mounted
  # over the image's, so other versions may not fit.
  image: grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
  resources:
    requests: {cpu: 200m, memory: 1Gi}
