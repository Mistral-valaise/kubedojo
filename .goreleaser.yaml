version: 2
project_name: kubedojo
builds:
  - main: ./cmd/kubedojo
    binary: kubedojo
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - {goos: windows, goarch: arm64}
archives:
  - formats: [tar.gz]
    format_overrides:
      - {goos: windows, formats: [zip]}
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
# An SBOM (SPDX, written by syft) next to every archive: <archive>.sbom.json.
sboms:
  - artifacts: archive
# One keyless Sigstore signature covers the release: checksums.txt lists the
# archives and their SBOMs, and checksums.txt.sigstore.json is the bundle of
# signature and certificate. "Verifying a release" in SECURITY.md checks it.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "--yes", "${artifact}"]
    output: true
changelog:
  use: github
