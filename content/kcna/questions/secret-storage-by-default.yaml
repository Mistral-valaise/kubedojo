title: How Secret values are stored by default
domain: kubernetes-fundamentals
difficulty: medium
tags: [secrets, configuration]
stem: |-
  A team puts a database password into a Secret, under `data`. The cluster has no additional
  configuration for Secrets.

  How is the password held in the cluster?
options:
  - text: Encrypted in etcd, with a key that only the API server holds
    explain: >-
      That describes encryption at rest. Kubernetes supports it, but an administrator has to enable
      it; it is the first recommendation for using Secrets safely.
  - text: Hashed in etcd, so that it can be compared but not read back
    explain: >-
      A Pod has to receive the real value as a file or environment variable, so a one-way hash would
      be useless. Secrets are stored in a readable form.
  - text: Encrypted in etcd, with a key that is unique to the namespace
    explain: >-
      There are no per-namespace keys. Namespaces limit who can read a Secret through the API (with
      RBAC), not how it is stored.
  - text: Base64-encoded in etcd, readable by anyone with access to it
    correct: true
explanation: >-
  Values under `data` are base64-encoded strings; that is an encoding for arbitrary bytes, not
  encryption. By default Secrets are stored unencrypted in etcd, so anyone with access to etcd, and
  anyone with API access to the Secret, can read them. To use Secrets safely, enable encryption at rest,
  give least-privilege RBAC access and consider an external secret store.
references:
  - title: Secrets
    url: https://kubernetes.io/docs/concepts/configuration/secret/
