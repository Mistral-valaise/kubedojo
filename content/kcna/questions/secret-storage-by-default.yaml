title: How Secret values are kept in etcd
domain: container-orchestration
difficulty: easy
tags: [security, secrets]
stem: |-
  A cluster was installed without any extra configuration of the API server. A developer creates a
  Secret with a database password; in the manifest the value appears as a base64 string.

  How is the password stored in etcd?
options:
  - text: Encrypted with a key that the API server generates at first start
    explain: >-
      Encryption at rest exists, but an administrator has to configure it for the API server. It is
      not active by default.
  - text: Hashed, so that it can be compared but not read back
    explain: >-
      A Secret has to be handed to Pods in clear text, so it cannot be stored as a one-way hash.
  - text: Unencrypted; base64 is an encoding and protects nothing
    correct: true
  - text: Encrypted with the signing key of the Namespace's ServiceAccounts
    explain: >-
      That key signs ServiceAccount tokens. It is not used to encrypt stored objects, and Namespaces
      have no keys of their own.
explanation: >-
  By default Secrets are stored unencrypted in etcd; the base64 in `data` only makes binary values
  fit into YAML and JSON. Anyone with access to etcd, anyone allowed to read Secrets through the API and
  anyone allowed to create Pods in the Namespace can get at the value. The documentation therefore
  recommends enabling encryption at rest, least-privilege RBAC rules for Secrets, restricting access
  to the containers that need it, and considering an external secret store.
references:
  - title: Secrets
    url: https://kubernetes.io/docs/concepts/configuration/secret/
