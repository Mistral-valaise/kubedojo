title: What a kubeconfig context holds
domain: kubernetes-fundamentals
difficulty: medium
tags: [kubectl, kubeconfig]
stem: |-
  An engineer works with a staging and a production cluster and switches between them with
  `kubectl config use-context staging` and `kubectl config use-context prod`.

  What does a context in a kubeconfig file group under one name?
options:
  - text: A cluster, a user and a namespace
    correct: true
  - text: A cluster, a Role and a namespace
    explain: >-
      Roles are RBAC objects stored in the cluster. A kubeconfig says who you are when you connect;
      what you may do is decided on the server.
  - text: A cluster, a user and a kubectl version
    explain: >-
      A kubeconfig does not pin client versions. The same file works with any kubectl that can talk to
      the cluster.
  - text: A cluster, a namespace and a resource quota
    explain: >-
      A ResourceQuota is an object in a namespace of the cluster. It is not part of the client
      configuration, and without a user the context could not authenticate.
explanation: >-
  A kubeconfig file has lists of clusters (API server address and CA), users (credentials) and
  contexts. A context groups access parameters under a convenient name and has three parameters:
  cluster, namespace and user. kubectl uses the current context unless told otherwise, so switching the
  context changes which cluster you talk to, as whom, and which namespace is the default.
references:
  - title: Organizing Cluster Access Using kubeconfig Files
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
