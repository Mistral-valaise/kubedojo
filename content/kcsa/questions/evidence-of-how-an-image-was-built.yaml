title: Evidence of how an image was built
domain: compliance-and-security-frameworks
difficulty: hard
tags: [supply-chain, slsa, sbom]
stem: |-
  A customer's supply chain policy demands verifiable evidence, for every released container image,
  of where and how it was produced: which build platform ran the build and from which inputs.

  Which artifact is defined for exactly this purpose?
options:
  - text: An SBOM in SPDX or CycloneDX format
    explain: >-
      A software bill of materials lists the components an artifact contains, with data such as
      versions and licences. It describes the content, not the build process that produced it.
  - text: A Cosign signature on the image digest
    explain: >-
      A signature shows that a certain identity signed this exact digest. Taken alone it says
      nothing about the platform or the inputs of the build.
  - text: A VEX document for the image
    explain: >-
      A Vulnerability Exploitability Exchange document states whether known vulnerabilities actually
      affect a product. It concerns vulnerabilities, not the origin of the artifact.
  - text: A SLSA provenance attestation
    correct: true
explanation: >-
  SLSA defines provenance as verifiable information about software artifacts describing where, when
  and how something was produced; build provenance is an attestation that a particular build platform
  produced a set of artifacts, and it records the inputs of the build. The levels of the SLSA build track are about this document: at Build L1
  provenance exists, at L2 it is signed and generated by a hosted build platform, and at L3 the
  platform is hardened against tampering during the build.
references:
  - title: SLSA build provenance
    url: https://slsa.dev/spec/v1.2/build-provenance
  - title: SLSA build track, security levels
    url: https://slsa.dev/spec/v1.2/build-track-basics
