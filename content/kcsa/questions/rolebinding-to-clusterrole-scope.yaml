title: A RoleBinding that references a ClusterRole
domain: kubernetes-security-fundamentals
difficulty: medium
tags: [authorization, rbac]
stem: |-
  The ClusterRole `secret-reader` allows `get` and `list` on Secrets. A RoleBinding in the namespace
  `dev` binds this ClusterRole to the user `dana`. No other binding names her.

  Where can `dana` read Secrets?
options:
  - text: In every namespace, because a ClusterRole is a cluster-wide object
    explain: >-
      The ClusterRole only defines the rules. Where they apply is decided by the binding: it takes
      a ClusterRoleBinding to grant them in all namespaces.
  - text: In the namespace `dev` only, because the binding sets the scope
    correct: true
  - text: In no namespace, because a RoleBinding can reference only a Role
    explain: >-
      A RoleBinding can reference a Role of its namespace or a ClusterRole. The second form is the
      usual way to reuse one set of rules in many namespaces.
  - text: In the namespace `kube-system` only, where ClusterRoles are kept
    explain: >-
      ClusterRoles are not namespaced, so they are not kept in any namespace. The namespace that
      counts is the one of the RoleBinding.
explanation: >-
  A RoleBinding grants permissions within its own namespace. It may reference a ClusterRole, and it
  then binds that ClusterRole to the namespace of the RoleBinding only. This lets an administrator
  define common roles once for the whole cluster and hand them out namespace by namespace. RBAC
  permissions are purely additive, so with no other binding `dana` has nothing elsewhere.
references:
  - title: Using RBAC Authorization - RoleBinding and ClusterRoleBinding
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#rolebinding-and-clusterrolebinding
