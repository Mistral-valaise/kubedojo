title: How a Secret is stored by default
domain: kubernetes-security-fundamentals
difficulty: easy
tags: [secrets, etcd]
stem: |-
  A team stores a database password in a Secret. The cluster uses the default configuration of the
  API server; nothing was set up for Secrets in particular.

  In which form does the password end up in etcd?
options:
  - text: Encrypted with a key that is derived from the cluster CA
    explain: >-
      The cluster CA signs certificates. No encryption key for stored data is derived from it, and
      nothing is encrypted at rest unless you configure it.
  - text: Hashed, so that it can be compared but not read back
    explain: >-
      A Pod must be able to obtain the original value, so a Secret cannot be stored as a hash. The
      value is kept as it is.
  - text: Encrypted with a key that is generated for each namespace
    explain: >-
      There are no per-namespace keys. When encryption at rest is configured, the providers and
      their keys are set for the API server as a whole.
  - text: Unencrypted; the base64 in the manifest is only an encoding
    correct: true
explanation: >-
  Secrets are, by default, stored unencrypted in etcd, the data store of the API server. The values
  in the `data` field are base64-encoded, which lets them carry binary data and provides no
  confidentiality. Anyone with access to etcd can read them, and so can anyone with API access to the
  Secret. That is why the documentation asks for encryption at rest and least-privilege RBAC rules
  for Secrets.
references:
  - title: Secrets
    url: https://kubernetes.io/docs/concepts/configuration/secret/
  - title: Encrypting Confidential Data at Rest
    url: https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
