title: A kubeconfig file from someone else
domain: kubernetes-cluster-component-security
difficulty: medium
tags: [client-security, kubectl]
stem: |-
  An engineer receives a kubeconfig file from an unknown sender and plans to point `kubectl` at it to
  look at the cluster it describes.

  Which risk does the Kubernetes documentation warn about in this situation?
options:
  - text: The file can give its author cluster-admin rights on the engineer's other clusters
    explain: >-
      Rights on a cluster are granted by that cluster's authorizers. A kubeconfig only holds client
      settings; it cannot change RBAC anywhere.
  - text: The file can make kubectl run malicious code on the engineer's machine
    correct: true
  - text: The file can replace the trusted CA certificates of the operating system
    explain: >-
      A kubeconfig can name a CA for the clusters it describes, which affects only connections made
      with that entry. The system trust store is not touched.
  - text: The file can make kubectl skip RBAC checks on the clusters it connects to
    explain: >-
      Authorization is decided by the API server, never by the client. No client setting can switch
      it off.
explanation: >-
  The documentation says to use kubeconfig files only from trusted sources: a specially crafted
  kubeconfig can lead to malicious code execution or file exposure. A kubeconfig is not just data;
  among other things it can name a command that kubectl runs to obtain credentials. Inspect an
  untrusted kubeconfig as carefully as you would a shell script.
references:
  - title: Organizing Cluster Access Using kubeconfig Files
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
