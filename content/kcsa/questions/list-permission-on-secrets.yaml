title: A Role with only list on Secrets
domain: kubernetes-threat-model
difficulty: medium
tags: [sensitive-data, secrets, rbac]
stem: |-
  To let an inventory tool show which Secrets exist, a Role grants its ServiceAccount the verb `list`
  on `secrets` in the namespace `payments`, deliberately without `get`. An attacker steals the tool's
  token.

  What can the attacker obtain from the Secrets in `payments`?
options:
  - text: Their names and types, because the data is only served for `get`
    explain: >-
      There is no reduced form of an object for `list`. A list response consists of the complete
      objects.
  - text: Their names and data keys, with the values replaced by a placeholder
    explain: >-
      That is how `kubectl describe secret` displays a Secret. The API itself returns the values,
      merely base64-encoded.
  - text: Their complete contents, because a list response contains the full objects
    correct: true
  - text: Nothing, because `list` on a resource is only evaluated together with `get`
    explain: >-
      Every verb is authorized on its own. A subject with only `list` can list, and cannot fetch
      single objects by name.
explanation: >-
  `get` obviously exposes a Secret, but `list` and `watch` reveal the contents just as well: the
  response to a list request, for example `kubectl get secrets -o yaml`, includes the data of every
  Secret. Least privilege for Secrets therefore means restricting all three verbs, and granting
  `get` on named Secrets where a component needs one.
references:
  - title: Role Based Access Control Good Practices
    url: https://kubernetes.io/docs/concepts/security/rbac-good-practices/
  - title: Good practices for Kubernetes Secrets
    url: https://kubernetes.io/docs/concepts/security/secrets-good-practices/
