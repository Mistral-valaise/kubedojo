title: What a stolen kubelet credential can read
domain: kubernetes-threat-model
difficulty: medium
tags: [trust-boundaries, node, authorization]
stem: |-
  An attacker gains root on the worker node `node-7` and copies the kubelet's client credential, which
  identifies it as `system:node:node-7` in the group `system:nodes`. The API server runs with
  `--authorization-mode=Node,RBAC` and the NodeRestriction admission plugin.

  Which Secrets can the attacker read through the Kubernetes API with this credential?
options:
  - text: All Secrets of the cluster, because the group `system:nodes` may read them
    explain: >-
      The Node authorizer does not hand kubelets a general read permission on Secrets. It decides
      request by request, from the relation between the requested object and the kubelet's own node.
  - text: All Secrets in the namespaces where `node-7` runs at least one Pod
    explain: >-
      The relation that counts is the single Pod, not its namespace. A Secret that no Pod on `node-7`
      uses stays out of reach, even when it lives next to one that is used there.
  - text: The Secrets that are used by Pods bound to `node-7`
    correct: true
  - text: No Secrets, because kubelets receive Secret data without reading it from the API
    explain: >-
      Reading Secrets is among the operations the Node authorizer allows kubelets: a kubelet fetches
      the Secrets its Pods need from the API server to make them available to the containers.
explanation: >-
  The boundary between a node and the control plane is drawn by the Node authorizer, a special-purpose
  authorization mode for requests made by kubelets. It allows a kubelet to read Secrets, ConfigMaps,
  PersistentVolumeClaims and PersistentVolumes only when they are related to Pods bound to its own
  node, and NodeRestriction limits its writes to its own Node object and those Pods. A compromised
  node therefore exposes what is scheduled onto it, not the whole cluster, which is a reason to keep
  workloads with valuable Secrets on separate nodes.
references:
  - title: Using Node Authorization
    url: https://kubernetes.io/docs/reference/access-authn-authz/node/
  - title: Admission Control in Kubernetes - NodeRestriction
    url: https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/#noderestriction
