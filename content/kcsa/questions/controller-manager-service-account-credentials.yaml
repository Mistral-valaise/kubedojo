title: Credentials of the built-in controllers
domain: kubernetes-cluster-component-security
difficulty: hard
tags: [controller-manager, rbac]
stem: |-
  A kube-controller-manager is started with `--use-service-account-credentials`.

  What does this flag change?
options:
  - text: It signs ServiceAccount tokens with a key that is kept apart from the cluster CA key
    explain: >-
      The signing key for ServiceAccount tokens is set with `--service-account-private-key-file`. It
      is a separate concern from the identity the controllers use themselves.
  - text: It creates the `default` ServiceAccount in every namespace that does not have one
    explain: >-
      The ServiceAccount controller does that in any case. The flag is about the credentials of the
      controllers, not about the objects they manage.
  - text: It makes each controller act with the ServiceAccount of the Pods it reconciles
    explain: >-
      Controllers never borrow the identity of workloads. A Deployment controller has its own
      identity, whatever ServiceAccount the Pods of a Deployment use.
  - text: It runs each controller with a ServiceAccount of its own instead of one shared identity
    correct: true
explanation: >-
  With `--use-service-account-credentials` the controller manager starts each built-in controller
  using a separate ServiceAccount, and a matching role prefixed `system:controller:` exists for each
  of them. Without the flag, all control loops run with the controller manager's own credential,
  which must then be granted all of those roles together. With separate identities each controller
  holds only the role that it needs.
references:
  - title: Using RBAC Authorization - Roles for built-in controllers
    url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#controller-roles
