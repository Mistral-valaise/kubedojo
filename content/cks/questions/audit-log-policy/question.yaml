title: Enable API audit logging
domain: runtime-security
difficulty: hard
minutes: 12
environment: secure
freshEnvironment: true
tags: [audit, apiserver, policy]
task: |
  Solve this question on: `ssh {{host}}`

  Enable audit logging for the kube-apiserver of this cluster.

  1. Create the audit policy `/etc/kubernetes/audit/policy.yaml` on the control plane node with these
     rules:
     - log `pods` at level `RequestResponse`
     - log `secrets` and `configmaps` at level `Metadata`
     - do **not** log anything else
  2. Configure the kube-apiserver to use this policy and to write the log to
     `/var/log/kubernetes/audit/audit.log`, keeping log files for at most `7` days and at most `2` old
     log files.

  The log file must be available on the node at that path.
hints:
  - "Search the Kubernetes docs for *Auditing*. Policy: `apiVersion: audit.k8s.io/v1`, `kind: Policy`, `rules:`. Rules are evaluated in order, first match wins — end with a catch-all `- level: None`."
  - "Flags: `--audit-policy-file`, `--audit-log-path`, `--audit-log-maxage`, `--audit-log-maxbackup`."
  - "The static Pod needs two hostPath volumes with volumeMounts: the policy file (read-only) and the log directory `/var/log/kubernetes/audit` (writable, type `DirectoryOrCreate`)."
checks:
  - id: flags
    title: The running API server has the audit flags set
    type: exec
    run: |-
      pgrep -a kube-apiserver | tr ' ' '\n' | grep -E '^--audit-(policy-file|log-path|log-maxage|log-maxbackup)=' | sort | xargs
    expect: {equals: "--audit-log-maxage=7 --audit-log-maxbackup=2 --audit-log-path=/var/log/kubernetes/audit/audit.log --audit-policy-file=/etc/kubernetes/audit/policy.yaml"}
    explain: >-
      The policy decides what is recorded, the log flags where it goes and how long it is kept. Both paths are paths inside the API server container and need hostPath mounts.
  - id: secrets
    title: Secret and ConfigMap access is logged at level Metadata
    type: exec
    run: |-
      log=/var/log/kubernetes/audit/audit.log
      [ -s "$log" ] || { echo "there is no audit log at $log" >&2; exit 1; }
      base=$(wc -l < "$log")
      kubectl -n kube-system get secrets >/dev/null 2>&1; kubectl -n kube-system get configmaps >/dev/null 2>&1
      new() { [ "$(wc -l < "$log")" -lt "$base" ] && base=0; tail -n +$((base + 1)) "$log" | jq -Rr 'fromjson? | select(.objectRef.resource == "secrets" or .objectRef.resource == "configmaps") | "\(.objectRef.resource)=\(.level)"' | sort -u | xargs; }
      for i in $(seq 1 20); do case "$(new)" in *configmaps=*secrets=*) break ;; esac; sleep 1; done
      new
    expect: {equals: "configmaps=Metadata secrets=Metadata"}
    explain: >-
      Metadata records who did what and when, without bodies. Secrets must never be logged at Request or RequestResponse level — the log would contain their values. Only requests made after the check started are looked at, so lines written by an earlier policy do not count.
  - id: pods
    title: Pod access is logged at level RequestResponse
    type: exec
    run: |-
      log=/var/log/kubernetes/audit/audit.log
      [ -s "$log" ] || { echo "there is no audit log at $log" >&2; exit 1; }
      base=$(wc -l < "$log")
      kubectl -n default get pods >/dev/null 2>&1
      new() { [ "$(wc -l < "$log")" -lt "$base" ] && base=0; tail -n +$((base + 1)) "$log" | jq -Rr 'fromjson? | select(.objectRef.resource == "pods" and (.objectRef.subresource // "") == "") | .level' | sort -u | xargs; }
      for i in $(seq 1 20); do [ -n "$(new)" ] && break; sleep 1; done
      new
    expect: {equals: RequestResponse}
    explain: >-
      RequestResponse additionally records the request and response objects. Rules are matched top to bottom; a broader rule placed first would win.
  - id: nothing-else
    title: Nothing else is logged
    type: exec
    run: |-
      log=/var/log/kubernetes/audit/audit.log
      [ -s "$log" ] || { echo "there is no audit log at $log" >&2; exit 1; }
      base=$(wc -l < "$log"); probe=kd-probe-$RANDOM$RANDOM
      kubectl get nodes >/dev/null 2>&1; kubectl get namespaces >/dev/null 2>&1; kubectl get --raw /version >/dev/null 2>&1
      kubectl -n default get configmap "$probe" >/dev/null 2>&1
      new() { [ "$(wc -l < "$log")" -lt "$base" ] && base=0; tail -n +$((base + 1)) "$log"; }
      for i in $(seq 1 20); do new | grep -q "$probe" && break; sleep 1; done
      other=$(new | jq -Rr 'fromjson? | select((.objectRef.resource // "non-resource") as $r | ["pods","secrets","configmaps"] | index($r) | not) | "\(.verb) \(.objectRef.resource // .requestURI)"')
      [ -z "$other" ] && { echo 0; exit 0; }
      echo "$(echo "$other" | wc -l | xargs) other events since this check started, for example: $(echo "$other" | sort | uniq -c | sort -rn | head -n 3 | awk '{print $2" "$3}' | paste -sd, -)"
    expect: {equals: "0"}
    explain: >-
      The check notes where the log ends, sends requests for Nodes, Namespaces and /version, waits until a marker request shows up in the log and then looks only at the lines written in between: none of them may be about anything but Pods, Secrets and ConfigMaps. Lines an earlier policy wrote are ignored. If other resources show up, a rule is too broad — and remember that the API server reads the policy only when it starts.
