title: CronJob with limits and a manual run
domain: application-design-build
difficulty: easy
minutes: 6
environment: base
tags: [cronjob, job]
task: |
  Solve this question on: `ssh {{host}}`

  Create a CronJob named `report-sync` in Namespace `app-beaver`:

  - one container named `sync`, image `busybox:1.36`, command `sh -c "echo report synced"`
  - it runs every 15 minutes
  - a new run is skipped while the previous one is still running
  - a run that could not be started within `45` seconds of its scheduled time is not started at all
  - a Job that takes longer than `30` seconds is terminated
  - the `2` most recent successful and the `4` most recent failed Jobs are kept

  Do not wait for the schedule to prove that it works: start a Job named `report-sync-manual` from the
  CronJob now. It must complete.
hints:
  - "`kubectl create cronjob --help` gives you the skeleton with `--dry-run=client -o yaml`; the remaining fields are in `kubectl explain cronjob.spec`."
  - "Three fields belong to the CronJob (`concurrencyPolicy`, `startingDeadlineSeconds`, the two history limits), one to the Job it creates: `jobTemplate.spec.activeDeadlineSeconds`."
  - "`kubectl -n app-beaver create job report-sync-manual --from=cronjob/report-sync`, then `kubectl -n app-beaver logs job/report-sync-manual`."
checks:
  - id: schedule
    title: CronJob report-sync runs every 15 minutes
    type: resource
    resource: cronjob/report-sync
    namespace: app-beaver
    jsonpath: "{.spec.schedule}"
    expect: {oneOf: ["*/15 * * * *", "0,15,30,45 * * * *", "0/15 * * * *"]}
    explain: >-
      The five fields are minute, hour, day of month, month, day of week. `*/15` in the first field means every 15 minutes; `15 * * * *` would mean once per hour at minute 15.
  - id: cron-policy
    title: Concurrency, starting deadline and history limits are set
    type: resource
    resource: cronjob/report-sync
    namespace: app-beaver
    jsonpath: "{.spec.concurrencyPolicy} {.spec.startingDeadlineSeconds} {.spec.successfulJobsHistoryLimit} {.spec.failedJobsHistoryLimit}"
    expect: {equals: "Forbid 45 2 4"}
    explain: >-
      These fields sit directly under the CronJob's spec. `Forbid` skips a run while the last one is active (`Replace` would kill it), and the defaults for the history are 3 successful and 1 failed Job.
  - id: job-deadline
    title: Jobs of the CronJob are terminated after 30 seconds
    type: resource
    resource: cronjob/report-sync
    namespace: app-beaver
    jsonpath: "{.spec.jobTemplate.spec.activeDeadlineSeconds}"
    expect: {equals: "30"}
    explain: >-
      activeDeadlineSeconds is a property of the Job, so it goes under jobTemplate.spec. The same field on the Pod template only fails a single Pod, and the Job would start another one.
  - id: manual-run
    title: Job report-sync-manual ran the CronJob's template and completed
    type: exec
    run: |-
      set -o pipefail
      q='.spec.template.spec.containers | map({name, image, command, args})'
      cj=$(kubectl -n app-beaver get cronjob report-sync -o json | jq -c ".spec.jobTemplate$q") || exit 1
      job=$(kubectl -n app-beaver get job report-sync-manual -o json | jq -c "$q") || exit 1
      [ "$cj" = "$job" ] || { echo "Job report-sync-manual does not run the containers of CronJob report-sync" >&2; exit 1; }
      [ "$(kubectl -n app-beaver get job report-sync-manual -o jsonpath='{.status.succeeded}')" = 1 ] || { echo "Job report-sync-manual has not completed" >&2; exit 1; }
      kubectl -n app-beaver logs job/report-sync-manual -c sync
    expect: {equals: report synced}
    retry: 30s
    explain: >-
      `kubectl create job --from=cronjob/<name>` copies the jobTemplate into a Job that starts immediately, which is how you test a CronJob without waiting for its schedule.
