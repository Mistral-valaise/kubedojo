title: Reuse a Released volume
domain: storage
difficulty: hard
minutes: 8
environment: base
tags: [pv, reclaim-policy, claimref]
task: |
  Solve this question on: `ssh {{host}}`

  Someone deleted a PersistentVolumeClaim by accident. Its PersistentVolume `kestrel-pv` has reclaim policy
  `Retain`, so the data is still there, but the volume is stuck in status `Released`.

  1. Make `kestrel-pv` usable again **without deleting it**.
  2. In Namespace `team-kestrel` create a PersistentVolumeClaim named `kestrel-restore` (`2Gi`,
     `ReadWriteOnce`) that binds to `kestrel-pv`.
hints:
  - "`kubectl get pv kestrel-pv -o yaml` — look at `spec.claimRef`. It still points to the claim that no longer exists."
  - "A PV becomes `Available` again when its `claimRef` is removed: `kubectl patch pv kestrel-pv --type json -p '[{\"op\":\"remove\",\"path\":\"/spec/claimRef\"}]'` or `kubectl edit pv`."
  - "The PV has no storage class. The new claim needs `storageClassName: \"\"` so it does not get a dynamically provisioned volume."
checks:
  - id: bound
    title: Claim kestrel-restore is Bound to kestrel-pv
    type: resource
    resource: pvc/kestrel-restore
    namespace: team-kestrel
    jsonpath: "{.status.phase} {.spec.volumeName}"
    expect: {equals: Bound kestrel-pv}
    explain: >-
      A Released volume keeps the claimRef (with the UID) of its old claim and is never bound again automatically, to protect the data. Removing the claimRef makes it Available.
  - id: same-pv
    title: kestrel-pv was not deleted and recreated
    type: resource
    resource: pv/kestrel-pv
    jsonpath: "{.metadata.annotations.kubedojo\\.dev/original} {.spec.persistentVolumeReclaimPolicy}"
    expect: {equals: "true Retain"}
    explain: >-
      With real storage, the PV object is the only pointer to the data. Editing the object in place keeps that link.
