title: Worker node is NotReady
domain: troubleshooting
difficulty: medium
minutes: 8
environment: ops
disruptive: true
tags: [kubelet, systemd, node]
task: |
  Solve this question on: `ssh {{host}}`

  Node `{{worker}}` has stopped reporting to the cluster and is (or will shortly be) `NotReady`.

  Find the cause and repair the node so that it is `Ready` again and stays that way.

  You can reach the node with `ssh {{worker}}` from `{{host}}`. Use `sudo -i` to become root.
hints:
  - "A node is NotReady when its kubelet no longer posts status. The kubelet is a systemd service: `systemctl status kubelet` on the node."
  - "`journalctl -u kubelet --no-pager | tail` shows why the service fails to start. `systemctl cat kubelet` prints the unit and its drop-in files, including their paths."
  - "The drop-in `10-kubeadm.conf` starts a kubelet binary at a path that does not exist. Compare with `which kubelet`, fix `ExecStart`, then `systemctl daemon-reload && systemctl restart kubelet`."
checks:
  - id: kubelet-active
    title: The kubelet service on the worker is running
    type: exec
    on: worker
    run: systemctl is-active kubelet
    expect: {equals: active}
    explain: The kubelet is not a Pod — it is a systemd service on every node. If it is not active, the node cannot run or report anything.
  - id: unit-path
    title: The kubelet unit starts an existing binary
    type: exec
    on: worker
    run: bin=$(systemctl show kubelet -p ExecStart --value | grep -o 'path=[^ ;]*' | head -1 | cut -d= -f2); test -x "$bin" && echo ok
    expect: {equals: ok}
    explain: The service failed with "No such file or directory" because ExecStart pointed to a wrong path. After editing a unit file, systemd needs `daemon-reload`.
  - id: node-ready
    title: The node is Ready
    type: exec
    run: kubectl get node ${KD_HOST}-worker -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
    expect: {equals: "True"}
    explain: Once the kubelet runs again it renews its lease and the node controller marks the node Ready.
