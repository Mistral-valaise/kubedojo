title: Application is unreachable
domain: troubleshooting
difficulty: medium
minutes: 8
environment: base
tags: [deployment, service, debugging]
task: |
  Solve this question on: `ssh {{host}}`

  Team Lynx reports that their web application in Namespace `team-lynx` is down. Requests to the
  Service `web` time out or are refused.

  Find and fix **all** problems so that:

  - Deployment `web` runs 3 ready replicas of an `nginx` image in version `1.27` (alpine variant)
  - Service `web` forwards traffic to these Pods on port `80`

  Do not delete and recreate the Deployment or the Service.
hints:
  - "Start with the big picture: `kubectl -n team-lynx get deploy,pod,svc,endpointslices`. Look at Pod status and at the Service's endpoints."
  - "`kubectl describe pod` shows why a Pod is not running in its Events. An empty endpoints list means the Service selector matches no ready Pods — compare `kubectl get svc web -o yaml` with the Pod labels."
  - "There are three problems: the image tag does not exist, the Service selector does not match the Pod labels, and the Service targetPort is not the port nginx listens on."
checks:
  - id: image
    title: Deployment web uses an nginx 1.27 alpine image
    type: resource
    resource: deployment/web
    namespace: team-lynx
    jsonpath: "{.spec.template.spec.containers[0].image}"
    expect: {matches: "^(docker\\.io/(library/)?)?nginx:1\\.27(\\.\\d+)?-alpine$"}
    explain: The Pods were stuck in ImagePullBackOff because the tag had a typo. `kubectl describe pod` shows the failing pull in its Events.
  - id: ready
    title: Deployment web has 3 ready replicas
    type: resource
    resource: deployment/web
    namespace: team-lynx
    jsonpath: "{.status.readyReplicas}"
    expect: {equals: "3"}
    explain: The rollout only completes when new Pods become Ready.
  - id: endpoints
    title: Service web has 3 endpoints
    type: exec
    run: kubectl -n team-lynx get endpointslices -l kubernetes.io/service-name=web -o jsonpath='{range .items[*].endpoints[*]}{.addresses[0]}{"\n"}{end}' | grep -c .
    expect: {equals: "3"}
    explain: A Service selects Pods by label. If the selector does not match the Pod template labels, the Service has no endpoints and connections are refused.
  - id: reachable
    title: The Service answers HTTP requests
    type: exec
    run: >-
      kubectl -n team-lynx run probe-$RANDOM --rm -i --restart=Never --quiet --image=busybox:1.36
      -- wget -qO- -T 5 http://web.team-lynx.svc.cluster.local 2>/dev/null | grep -q 'Welcome to nginx' && echo reachable
    expect: {equals: reachable}
    explain: Even with endpoints, the Service must send traffic to the port the container actually listens on (targetPort 80 for nginx).
  - id: not-recreated
    title: The Deployment was repaired in place and is healthy
    type: exec
    run: >-
      kubectl -n team-lynx get deployment web
      -o jsonpath='{.metadata.annotations.kubedojo\.dev/original}/{.status.readyReplicas}'
    expect: {equals: "true/3"}
    explain: In production you fix a live object in place (edit, set image, patch) — recreating it causes avoidable downtime and loses rollout history.
