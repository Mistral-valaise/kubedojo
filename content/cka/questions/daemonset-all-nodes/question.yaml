title: Run an agent on every node
domain: workloads-scheduling
difficulty: medium
minutes: 7
environment: base
tags: [daemonset, tolerations]
task: |
  Solve this question on: `ssh {{host}}`

  Create a DaemonSet named `node-agent` in Namespace `team-owl`.

  - Image `busybox:1.36`, command `sleep 1d`
  - Labels `app=node-agent` on the Pods
  - Resource requests: `10m` CPU and `16Mi` memory
  - It must run on **all** nodes of the cluster, including the control plane node
hints:
  - "There is no `kubectl create daemonset`. Generate a Deployment with `$do`, change `kind` to `DaemonSet` and remove `replicas`, `strategy` and `status`."
  - "`kubectl describe node {{host}}-control-plane | grep Taints` shows why Pods avoid the control plane."
  - "Add a toleration for key `node-role.kubernetes.io/control-plane` with effect `NoSchedule` to the Pod template."
checks:
  - id: all-nodes
    title: One ready Pod per node, including the control plane
    type: exec
    run: '[ "$(kubectl -n team-owl get ds node-agent -o jsonpath={.status.numberReady})" = "$(kubectl get nodes --no-headers | wc -l | xargs)" ] && echo ok'
    expect: {equals: ok}
    explain: >-
      A DaemonSet creates one Pod per eligible node. The control plane node is tainted NoSchedule, so it is only eligible if the Pods tolerate that taint.
  - id: toleration
    title: The Pods tolerate the control plane taint
    type: exec
    run: |-
      kubectl -n team-owl get ds node-agent -o json | jq -r '[.spec.template.spec.tolerations[]? | select(.key=="node-role.kubernetes.io/control-plane" or (.operator=="Exists" and .key==null))] | length > 0'
    expect: {equals: "true"}
    explain: >-
      A toleration lets a Pod onto a tainted node. Removing the taint from the node instead would open the control plane to every workload.
  - id: requests
    title: Requests are 10m CPU and 16Mi memory
    type: resource
    resource: daemonset/node-agent
    namespace: team-owl
    jsonpath: "{.spec.template.spec.containers[0].resources.requests.cpu} {.spec.template.spec.containers[0].resources.requests.memory}"
    expect: {equals: 10m 16Mi}
    explain: >-
      Agents run on every node, so their requests are multiplied by the node count — keep them small and explicit.
  - id: labels
    title: The Pods are labeled app=node-agent
    type: resource
    resource: daemonset/node-agent
    namespace: team-owl
    jsonpath: "{.spec.template.metadata.labels.app}"
    expect: {equals: node-agent}
    explain: >-
      The selector of a DaemonSet must match the labels in its Pod template, exactly like for a Deployment.
