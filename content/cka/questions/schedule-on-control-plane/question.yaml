title: Schedule a Pod on the control plane
domain: workloads-scheduling
difficulty: medium
minutes: 6
environment: base
tags: [taints, tolerations, nodeselector]
task: |
  Solve this question on: `ssh {{host}}`

  Create a Pod named `cp-probe` in Namespace `team-wader` with image `busybox:1.36` and command
  `sleep 1d`.

  The Pod must be placed **by the scheduler** on the control plane node — and only there.

  - Do not change the taints or labels of any node.
  - Do not set `nodeName`.
hints:
  - "Two things are needed: something that lets the Pod *onto* the tainted node, and something that keeps it *away* from all other nodes."
  - "`kubectl get node {{host}}-control-plane --show-labels` and `kubectl describe node {{host}}-control-plane | grep Taints`."
  - "Toleration for `node-role.kubernetes.io/control-plane:NoSchedule` plus `nodeSelector: {node-role.kubernetes.io/control-plane: \"\"}`."
checks:
  - id: placed
    title: The Pod runs on the control plane node
    type: exec
    run: |-
      kubectl -n team-wader get pod cp-probe -o jsonpath='{.status.phase} {.spec.nodeName}'
    expect: {matches: "^Running \\S+-control-plane$"}
    explain: >-
      A toleration only permits a node; the nodeSelector (or node affinity) is what restricts the Pod to it. You need both.
  - id: scheduler
    title: The Pod was placed by the scheduler
    type: exec
    run: |-
      kubectl -n team-wader get events --field-selector involvedObject.name=cp-probe,reason=Scheduled -o name | wc -l | xargs
    expect: {gte: 1}
    explain: >-
      Setting nodeName bypasses the scheduler entirely — it would ignore the taint, but also resources and every other scheduling rule. Only the scheduler emits the Scheduled event.
  - id: taint-kept
    title: The control plane node is still tainted
    type: exec
    run: |-
      kubectl get node ${KD_HOST}-control-plane -o jsonpath='{.spec.taints[?(@.key=="node-role.kubernetes.io/control-plane")].effect}'
    expect: {equals: NoSchedule}
    explain: >-
      Removing the taint would let every workload onto the control plane and risk the API server's resources.
